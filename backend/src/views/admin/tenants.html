<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Tenants - Admin CMS</title>
    <link rel="stylesheet" href="/admin/styles.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>MicroSite CMS</h2>
        </div>
        <ul class="sidebar-nav">
            <li><a href="/admin/dashboard">Dashboard</a></li>
            <li><a href="/admin/tenants" class="active">Tenants</a></li>
            <li><a href="/admin/pages">Pages</a></li>
            <li><a href="/admin/themes">Themes</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Manage Tenants</h1>
            <div>
                <button class="btn-primary" onclick="showCreateModal()">+ New Tenant</button>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="table-container">
            <table class="data-table" id="tenantsTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Domain</th>
                        <th>Theme</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="5" class="loading">Loading tenants...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Create/Edit Modal -->
    <div id="tenantModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Create Tenant</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <form id="tenantForm">
                <input type="hidden" id="tenantId">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="tenantName" required>
                </div>
                <div class="form-group">
                    <label>Domain</label>
                    <input type="text" id="tenantDomain" required>
                </div>
                <div class="form-group">
                    <label>Primary Color</label>
                    <input type="color" id="primaryColor" value="#007bff">
                </div>
                <div class="form-group">
                    <label>Text Color</label>
                    <input type="color" id="textColor" value="#212529">
                </div>
                <div class="form-group">
                    <label>Background Color</label>
                    <input type="color" id="bgColor" value="#ffffff">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/admin/common.js"></script>
    <script>
        const API_BASE = '/admin/api';
        let tenants = [];
        let themes = [];

        async function loadTenants() {
            try {
                const data = await fetchWithAuth(`${API_BASE}/tenants`);
                if (!data) return;
                tenants = data.tenants;

                const tbody = document.querySelector('#tenantsTable tbody');
                if (tenants.length > 0) {
                    tbody.innerHTML = tenants.map(tenant => `
                        <tr>
                            <td>${tenant.name}</td>
                            <td>${tenant.domain}</td>
                            <td>${tenant.themeId ? 'Theme ' + tenant.themeId : 'None'}</td>
                            <td>${new Date(tenant.createdAt).toLocaleDateString()}</td>
                            <td>
                                <button class="btn-sm btn-edit" onclick="editTenant('${tenant._id}')">Edit</button>
                                <button class="btn-sm btn-delete" onclick="deleteTenant('${tenant._id}')">Delete</button>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="5">No tenants found</td></tr>';
                }
            } catch (error) {
                console.error('Error loading tenants:', error);
            }
        }

        function showCreateModal() {
            document.getElementById('modalTitle').textContent = 'Create Tenant';
            document.getElementById('tenantForm').reset();
            document.getElementById('tenantId').value = '';
            document.getElementById('tenantModal').style.display = 'block';
        }

        function editTenant(id) {
            const tenant = tenants.find(t => t._id === id);
            if (!tenant) return;

            document.getElementById('modalTitle').textContent = 'Edit Tenant';
            document.getElementById('tenantId').value = tenant._id;
            document.getElementById('tenantName').value = tenant.name;
            document.getElementById('tenantDomain').value = tenant.domain;
            document.getElementById('primaryColor').value = tenant.settings?.colors?.primary || '#007bff';
            document.getElementById('textColor').value = tenant.settings?.colors?.text || '#212529';
            document.getElementById('bgColor').value = tenant.settings?.colors?.background || '#ffffff';
            document.getElementById('tenantModal').style.display = 'block';
        }

        async function deleteTenant(id) {
            if (!confirm('Are you sure you want to delete this tenant?')) return;

            try {
                const response = await fetchWithAuth(`${API_BASE}/tenants/${id}`, {
                    method: 'DELETE'
                });
                if (response) {
                    loadTenants();
                }
            } catch (error) {
                alert('Error deleting tenant');
            }
        }

        document.getElementById('tenantForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('tenantId').value;
            const name = document.getElementById('tenantName').value;
            const domain = document.getElementById('tenantDomain').value;
            const settings = {
                colors: {
                    primary: document.getElementById('primaryColor').value,
                    text: document.getElementById('textColor').value,
                    background: document.getElementById('bgColor').value
                }
            };

            try {
                if (id) {
                    // Update existing tenant
                    await fetchWithAuth(`${API_BASE}/tenants/${id}/settings`, {
                        method: 'PUT',
                        body: JSON.stringify({ settings })
                    });
                } else {
                    // Create new tenant
                    await fetchWithAuth(`${API_BASE}/tenants`, {
                        method: 'POST',
                        body: JSON.stringify({ name, domain, settings })
                    });
                }
                closeModal();
                loadTenants();
            } catch (error) {
                alert('Error saving tenant');
            }
        });

        function closeModal() {
            document.getElementById('tenantModal').style.display = 'none';
        }

        loadTenants();
    </script>
</body>
</html>
