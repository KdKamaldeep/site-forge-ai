<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Themes - Admin CMS</title>
    <link rel="stylesheet" href="/admin/styles.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>MicroSite CMS</h2>
        </div>
        <ul class="sidebar-nav">
            <li><a href="/admin/dashboard">Dashboard</a></li>
            <li><a href="/admin/tenants">Tenants</a></li>
            <li><a href="/admin/pages">Pages</a></li>
            <li><a href="/admin/themes" class="active">Themes</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Manage Themes</h1>
            <div>
                <button class="btn-primary" onclick="showCreateModal()">+ New Theme</button>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="table-container">
            <table class="data-table" id="themesTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Description</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="4" class="loading">Loading themes...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Create/Edit Modal -->
    <div id="themeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Create Theme</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <form id="themeForm">
                <input type="hidden" id="themeId">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="themeName" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="themeDescription" rows="3"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/admin/common.js"></script>
    <script>
        const API_BASE = '/admin/api';
        let themes = [];

        async function loadThemes() {
            try {
                const data = await fetchWithAuth(`${API_BASE}/themes`);
                if (!data) return;
                themes = data.themes;

                const tbody = document.querySelector('#themesTable tbody');
                if (themes.length > 0) {
                    tbody.innerHTML = themes.map(theme => `
                        <tr>
                            <td>${theme.name}</td>
                            <td>${theme.description || 'No description'}</td>
                            <td>${new Date(theme.createdAt).toLocaleDateString()}</td>
                            <td>
                                <button class="btn-sm btn-edit" onclick="editTheme('${theme._id}')">Edit</button>
                                <button class="btn-sm btn-delete" onclick="deleteTheme('${theme._id}')">Delete</button>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="4">No themes found</td></tr>';
                }
            } catch (error) {
                console.error('Error loading themes:', error);
            }
        }

        function showCreateModal() {
            document.getElementById('modalTitle').textContent = 'Create Theme';
            document.getElementById('themeForm').reset();
            document.getElementById('themeId').value = '';
            document.getElementById('themeModal').style.display = 'block';
        }

        async function editTheme(id) {
            const theme = themes.find(t => t._id === id);
            if (!theme) return;

            const fullTheme = await fetchWithAuth(`${API_BASE}/themes/${id}`);
            if (!fullTheme) return;

            document.getElementById('modalTitle').textContent = 'Edit Theme';
            document.getElementById('themeId').value = fullTheme._id;
            document.getElementById('themeName').value = fullTheme.name;
            document.getElementById('themeDescription').value = fullTheme.description || '';
            document.getElementById('themeModal').style.display = 'block';
        }

        async function deleteTheme(id) {
            if (!confirm('Are you sure you want to delete this theme?')) return;

            try {
                const response = await fetchWithAuth(`${API_BASE}/themes/${id}`, {
                    method: 'DELETE'
                });
                if (response) {
                    loadThemes();
                }
            } catch (error) {
                alert('Error deleting theme');
            }
        }

        document.getElementById('themeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('themeId').value;
            const themeData = {
                name: document.getElementById('themeName').value,
                description: document.getElementById('themeDescription').value
            };

            try {
                const url = id ? `${API_BASE}/themes/${id}` : `${API_BASE}/themes`;
                const method = id ? 'PUT' : 'POST';
                
                const response = await fetchWithAuth(url, {
                    method,
                    body: JSON.stringify(themeData)
                });

                if (response) {
                    closeModal();
                    loadThemes();
                }
            } catch (error) {
                alert('Error saving theme');
            }
        });

        function closeModal() {
            document.getElementById('themeModal').style.display = 'none';
        }

        loadThemes();
    </script>
</body>
</html>
